services:
  - type: web
    name: leave-bot
    runtime: docker
    plan: starter # persistent disk requires a paid plan; free tier sleeps and loses the WhatsApp session
    healthCheckPath: /
    disk:
      name: leave-bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TZ
        value: Asia/Kolkata
      - key: CRON_SCHEDULE
        value: "0 9 * * *"
      - key: NOTIFY_DAYS
        value: "60"
      - key: GROUP_INVITE_CODE
        sync: false # paste the WhatsApp group invite link/code in the Render dashboard
      - key: TEST_TOKEN
        generateValue: true
